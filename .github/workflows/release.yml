name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Build
        run: go build -trimpath -o mullion.exe .

      - name: Test
        run: go test ./...

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path mullion.exe -DestinationPath "mullion-${{ github.ref_name }}-windows-amd64.zip"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mullion.exe
            mullion-${{ github.ref_name }}-windows-amd64.zip
          generate_release_notes: true
